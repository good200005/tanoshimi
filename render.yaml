services:
  - type: web
    name: tanoshimi
    runtime: docker
    plan: free
    dockerfilePath: ./tanoshimi/Dockerfile
    dockerContext: ./tanoshimi
    healthCheckPath: /login
    autoDeploy: true
    envVars:
      # --- DB: TiDB Cloud(MySQL 호환, TLS 필수). 값은 대시보드에서 입력 ---
      # URL 예: jdbc:mysql://<HOST>:4000/tanoshimi?serverTimezone=Asia/Seoul&characterEncoding=UTF-8&sslMode=REQUIRED&allowPublicKeyRetrieval=true
      - key: SPRING_DATASOURCE_URL
        sync: false
      - key: SPRING_DATASOURCE_USERNAME
        sync: false
      - key: SPRING_DATASOURCE_PASSWORD
        sync: false
      # --- 리버스 프록시(HTTPS) 뒤에서 동작하기 위한 설정 ---
      - key: SERVER_FORWARD_HEADERS_STRATEGY
        value: framework
      - key: SERVER_SERVLET_SESSION_COOKIE_SECURE
        value: "true"
      # --- 운영 설정 ---
      - key: SPRING_THYMELEAF_CACHE
        value: "true"
      - key: LOGGING_LEVEL_NET_DATASA_TANOSHIMI
        value: INFO
      - key: UPLOAD_DIR
        value: /tmp/uploads
      - key: SPRING_DATASOURCE_HIKARI_MAXIMUM_POOL_SIZE
        value: "5"
      - key: REMEMBER_ME_KEY
        generateValue: true
      # --- 소셜 로그인: 값이 비어 있으면 앱이 기동 실패하므로 dummy 로 둔다(소셜 버튼만 동작 안 함). 키 발급 후 교체 ---
      - key: GOOGLE_CLIENT_ID
        value: dummy
      - key: GOOGLE_CLIENT_SECRET
        value: dummy
      - key: NAVER_CLIENT_ID
        value: dummy
      - key: NAVER_CLIENT_SECRET
        value: dummy
      - key: LINE_CLIENT_ID
        value: dummy
      - key: LINE_CLIENT_SECRET
        value: dummy
      # --- 이메일 인증 실발송(SMTP). 값은 대시보드에서 입력(Gmail 은 앱 비밀번호) ---
      - key: APP_EMAIL_PROVIDER
        value: smtp
      - key: MAIL_HOST
        value: smtp.gmail.com
      - key: MAIL_USERNAME
        sync: false
      - key: MAIL_PASSWORD
        sync: false
      - key: MAIL_FROM
        sync: false
