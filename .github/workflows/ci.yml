# 단위 테스트 + 커버리지 (JaCoCo)
#
# PR 과 main 푸시 때마다 ./gradlew test 를 돌린다. 테스트는 DB·외부 API 없이 동작(Spring 컨텍스트 미기동)이라
# Secrets 가 필요 없다. 커버리지 리포트는 artifact 로 내려받을 수 있다.
name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  test:
    name: Test (JDK 21)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    defaults:
      run:
        working-directory: tanoshimi
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"

      - uses: gradle/actions/setup-gradle@v4

      # Windows 에서 커밋된 gradlew 의 CRLF/실행권한 문제 방지
      - name: Prepare gradlew
        run: sed -i 's/\r$//' gradlew && chmod +x gradlew

      - name: Test
        run: ./gradlew test --console=plain

      - name: Upload coverage report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: jacoco-report
          path: tanoshimi/build/reports/jacoco/test/
          if-no-files-found: ignore
